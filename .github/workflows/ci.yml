name: CI/CD - democyber

# Trigger the workflow on push or pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4
        # Debug : afficher la valeur de la variable
      - name: Debug image name
        run: |
          echo "Image name = $DOCKER_IMAGE_NAME"
          echo "Longueur = ${#DOCKER_IMAGE_NAME}"

